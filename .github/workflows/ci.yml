name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Testes (Mono) e pacote
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Mono
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mono-complete zip
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verificar scripts da interface
        run: for f in ui/*.js; do node --check "$f"; done
      - name: Testes sem hardware + LumeRGB.exe (C# 5)
        run: bash tools/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: LumeRGB
          path: dist/LumeRGB.zip
          retention-days: 14

  windows:
    name: Compilação e testes no Windows (.NET Framework)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compilar como o COMPILAR.bat e o atualizador, e rodar os testes
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools\ci-windows.ps1
